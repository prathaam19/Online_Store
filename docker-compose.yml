version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: foodmart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-foodmart}
      MYSQL_USER: ${DB_USERNAME:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - foodmart-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend (Spring Boot)
  backend:
    build:
      context: ./food
      dockerfile: Dockerfile
    container_name: foodmart-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-foodmart}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-ChangeThisSecretKeyChangeThisSecretKey}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_BLtQ4MAIVBksGL}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-OsuNHnliz3IYLbOteAJVOzrq}
      APP_SELLER_INVITE_CODE: ${APP_SELLER_INVITE_CODE:-SELLER_SECRET}
      APP_ADMIN_INVITE_CODE: ${APP_ADMIN_INVITE_CODE:-ADMIN_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - foodmart-network
    volumes:
      - ./food/uploads:/app/uploads

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodmart-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - foodmart-network

volumes:
  mysql-data:

networks:
  foodmart-network:
    driver: bridge
