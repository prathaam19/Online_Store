spring.application.name=food

spring.datasource.url=jdbc:mysql://localhost:3306/foodmart
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT settings (replace the secret with a secure value in production)
jwt.secret=ChangeThisSecretKeyChangeThisSecretKey
jwt.expiration-ms=3600000

# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email settings
mail.from=noreply@foodmart.com
mail.from.name=FoodMart

# Razorpay Configuration
razorpay.key-id=your_razorpay_key_id
razorpay.key-secret=your_razorpay_key_secret

# Business Account Settings
business.account.name=FoodMart
business.account.email=business@foodmart.com
business.account.phone=+91-XXXXXXXXXX
